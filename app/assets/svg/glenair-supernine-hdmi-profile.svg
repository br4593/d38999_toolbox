<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- SuperNine HDMI 2.0 side / profile elevation (Shell 17 panel mount coupler) -->
  <!-- Panel (dashed) -->
  <rect x="166" y="6" width="6" height="108" fill="currentColor" opacity="0.08" stroke="none"/>
  <line x1="169" y1="6" x2="169" y2="114" stroke-dasharray="5 4" opacity="0.5" stroke-width="1.5"/>
  <!-- Coupling shell (mating face) -->
  <rect x="28" y="34" width="26" height="52" rx="3" stroke-width="1.6" opacity="0.55"/>
  <!-- Main shell body (size 17) -->
  <rect x="54" y="28" width="100" height="64" rx="7"/>
  <!-- Square mounting flange -->
  <rect x="154" y="14" width="14" height="92" rx="2" stroke-width="2"/>
  <circle cx="161" cy="24" r="4" stroke-width="1.4" opacity="0.7"/>
  <circle cx="161" cy="96" r="4" stroke-width="1.4" opacity="0.7"/>
  <!-- HDMI Type-A trapezoid port on mating face -->
  <path d="M34 50 H54 V62 L48 70 H40 L34 62 Z" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="38" y1="54" x2="50" y2="54" stroke-width="2" opacity="0.18"/>
  <!-- Master key -->
  <rect x="100" y="20" width="9" height="8" rx="1.5" fill="currentColor" opacity="0.3" stroke="none"/>
  <!-- Rear leads (PC tail / solder cup) -->
  <line x1="172" y1="48" x2="252" y2="48" stroke-width="1.5" opacity="0.6"/>
  <line x1="172" y1="60" x2="252" y2="60" stroke-width="1.5" opacity="0.6"/>
  <line x1="172" y1="72" x2="252" y2="72" stroke-width="1.5" opacity="0.6"/>
  <text x="140" y="112" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">SuperNine HDMI 2.0 — Side Profile (Shell 17)</text>
</svg>
