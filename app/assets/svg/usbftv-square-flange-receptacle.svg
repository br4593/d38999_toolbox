<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 120" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- Panel (dashed) -->
  <rect x="158" y="4" width="6" height="112" fill="currentColor" opacity="0.08" stroke="none"/>
  <line x1="161" y1="4" x2="161" y2="116" stroke-dasharray="5 4" opacity="0.5" stroke-width="1.5"/>
  <!-- Shell body -->
  <rect x="56" y="22" width="100" height="70" rx="6"/>
  <!-- Square flange plate -->
  <rect x="164" y="10" width="62" height="94" rx="3" stroke-width="2"/>
  <!-- 4 mounting holes -->
  <circle cx="178" cy="24" r="4.5" stroke-width="1.5"/>
  <circle cx="212" cy="24" r="4.5" stroke-width="1.5"/>
  <circle cx="178" cy="90" r="4.5" stroke-width="1.5"/>
  <circle cx="212" cy="90" r="4.5" stroke-width="1.5"/>
  <!-- USB-A port (USB 2.0) -->
  <rect x="86" y="44" width="28" height="20" rx="2" stroke-width="2"/>
  <line x1="93" y1="48" x2="93" y2="54" stroke-width="1.2" opacity="0.6"/>
  <line x1="99" y1="48" x2="99" y2="54" stroke-width="1.2" opacity="0.6"/>
  <line x1="105" y1="48" x2="105" y2="54" stroke-width="1.2" opacity="0.6"/>
  <line x1="111" y1="48" x2="111" y2="54" stroke-width="1.2" opacity="0.6"/>
  <!-- Keying notch -->
  <rect x="102" y="14" width="8" height="6" rx="1.5" fill="currentColor" opacity="0.3"/>
  <!-- Wire leads -->
  <line x1="230" y1="46" x2="252" y2="46" stroke-width="1.5" opacity="0.6"/>
  <line x1="230" y1="56" x2="252" y2="56" stroke-width="1.5" opacity="0.6"/>
  <line x1="230" y1="66" x2="252" y2="66" stroke-width="1.5" opacity="0.6"/>
  <text x="140" y="116" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">USBFTV Square Flange Receptacle</text>
</svg>
