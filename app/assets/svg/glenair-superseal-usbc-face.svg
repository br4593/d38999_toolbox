<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 108" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- D38999 Series III shell (compact size 13) -->
  <circle cx="110" cy="50" r="37" stroke-width="2.5"/>
  <circle cx="110" cy="50" r="32" stroke-width="1.4" opacity="0.45"/>
  <!-- Master keyway (top) + polarizing keys -->
  <rect x="106" y="13" width="8" height="6" rx="1" fill="currentColor" opacity="0.3" stroke="none"/>
  <rect x="141" y="60" width="7" height="4" rx="1" fill="currentColor" opacity="0.22" stroke="none" transform="rotate(-38 144 62)"/>
  <rect x="72" y="60" width="7" height="4" rx="1" fill="currentColor" opacity="0.22" stroke="none" transform="rotate(38 75 62)"/>
  <!-- USB Type-C receptacle (oval/stadium opening) -->
  <rect x="92" y="45" width="36" height="11" rx="5.5" stroke-width="2"/>
  <!-- Center tongue with contact rows -->
  <rect x="98" y="48.5" width="24" height="4" rx="2" fill="currentColor" opacity="0.14" stroke="none"/>
  <line x1="101" y1="49" x2="101" y2="52" stroke-width="0.9" opacity="0.55"/>
  <line x1="105" y1="49" x2="105" y2="52" stroke-width="0.9" opacity="0.55"/>
  <line x1="109" y1="49" x2="109" y2="52" stroke-width="0.9" opacity="0.55"/>
  <line x1="113" y1="49" x2="113" y2="52" stroke-width="0.9" opacity="0.55"/>
  <line x1="117" y1="49" x2="117" y2="52" stroke-width="0.9" opacity="0.55"/>
  <text x="110" y="104" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">SuperSeal USB-C 3.2 Gen 2 (Shell 13)</text>
</svg>
