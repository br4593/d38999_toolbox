<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- SuperSeal DisplayPort 1.4 — Wall-Mount Receptacle (00 slotted / D0 round) Shell 17 -->
  <!-- Panel (dashed) -->
  <rect x="172" y="6" width="6" height="108" fill="currentColor" opacity="0.08" stroke="none"/>
  <line x1="175" y1="6" x2="175" y2="114" stroke-dasharray="5 4" opacity="0.5" stroke-width="1.5"/>
  <!-- Coupling shell (mating face) -->
  <rect x="28" y="32" width="26" height="56" rx="3" stroke-width="1.6" opacity="0.55"/>
  <!-- Main shell body (size 17) -->
  <rect x="54" y="26" width="106" height="68" rx="7"/>
  <!-- Square mounting flange with mount holes -->
  <rect x="160" y="12" width="15" height="96" rx="2" stroke-width="2"/>
  <circle cx="167" cy="22" r="4" stroke-width="1.4" opacity="0.7"/>
  <circle cx="167" cy="98" r="4" stroke-width="1.4" opacity="0.7"/>
  <!-- DisplayPort port (chamfered rect) on mating face -->
  <path d="M34 48 H54 V70 H40 L34 64 Z" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="38" y1="52" x2="50" y2="52" stroke-width="2" opacity="0.18"/>
  <!-- Master key -->
  <rect x="102" y="18" width="9" height="8" rx="1.5" fill="currentColor" opacity="0.3" stroke="none"/>
  <!-- Rear PC tail leads -->
  <line x1="178" y1="48" x2="252" y2="48" stroke-width="1.5" opacity="0.6"/>
  <line x1="178" y1="60" x2="252" y2="60" stroke-width="1.5" opacity="0.6"/>
  <line x1="178" y1="72" x2="252" y2="72" stroke-width="1.5" opacity="0.6"/>
  <text x="140" y="112" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">SuperSeal DisplayPort 1.4 — Wall-Mount Receptacle</text>
</svg>
