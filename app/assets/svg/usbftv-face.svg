  <rect x="106" y="14" width="8" height="5" rx="1.5" fill="currentColor" opacity="0.3" stroke="none"/>
  <circle cx="110" cy="82" r="2" fill="currentColor" opacity="0.2" stroke="none"/>
  <text x="110" y="96" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">USBFTV Face (Shell 15)</text>
