<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 130" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
  <!-- SuperNine RJ45 side elevation: plug, axis horizontal (mating face left, cable rear right) -->
  <!-- center axis -->
  <line x1="22" y1="65" x2="284" y2="65" stroke-width="0.8" stroke-dasharray="8 4 2 4" opacity="0.35"/>

  <!-- Mating-face rim / coupling shoulder -->
  <path d="M40 30 H30 a4 4 0 0 0 -4 4 V96 a4 4 0 0 0 4 4 H40" stroke-width="1.6" opacity="0.7"/>

  <!-- Knurled coupling nut (front, largest dia) -->
  <rect x="40" y="22" width="46" height="86" rx="4"/>
  <g stroke-width="0.9" opacity="0.5">
    <path d="M46 26 V104 M52 26 V104 M58 26 V104 M64 26 V104 M70 26 V104 M76 26 V104 M82 26 V104"/>
  </g>

  <!-- Coupling-to-shell step -->
  <rect x="86" y="30" width="8" height="70" rx="2" stroke-width="1.4" opacity="0.75"/>

  <!-- Main D38999-style shell body -->
  <rect x="94" y="34" width="84" height="62" rx="6"/>
  <!-- master keyway hint (top) -->
  <path d="M126 34 v-7 h12 v7" stroke-width="1.4" opacity="0.6"/>

  <!-- Rear accessory thread band (backshell coupling) -->
  <rect x="178" y="40" width="40" height="50" rx="3" stroke-width="1.6" opacity="0.8"/>
  <g stroke-width="0.85" opacity="0.45">
    <path d="M183 44 l4 6 M191 44 l4 6 M199 44 l4 6 M207 44 l4 6 M215 44 l4 6
             M183 80 l4 6 M191 80 l4 6 M199 80 l4 6 M207 80 l4 6 M215 80 l4 6"/>
  </g>

  <!-- Cable / backshell exit, tapering -->
  <path d="M218 48 H236 a6 6 0 0 1 6 6 V76 a6 6 0 0 1 -6 6 H218" stroke-width="1.6" opacity="0.8"/>
  <path d="M242 56 H262 M242 74 H262" stroke-width="1.4" opacity="0.55"/>

  <!-- RJ45 8P8C jack hinted on the mating face -->
  <rect x="30" y="50" width="14" height="30" rx="2" stroke-width="1.5"/>
  <rect x="33" y="70" width="8" height="7" rx="1" fill="currentColor" stroke="none" opacity="0.22"/>
</svg>
