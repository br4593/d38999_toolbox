<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- SuperNine RJ45 side / profile elevation (coupler / receptacle outline) -->
  <!-- Mating face (left) coupling shell -->
  <rect x="30" y="34" width="26" height="52" rx="3" stroke-width="1.6" opacity="0.55"/>
  <!-- Main D38999-style shell body -->
  <rect x="56" y="28" width="120" height="64" rx="7"/>
  <!-- Coupling / accessory thread bands (rear) -->
  <line x1="176" y1="36" x2="176" y2="84" stroke-width="1" opacity="0.4"/>
  <rect x="176" y="34" width="40" height="52" rx="4" stroke-width="1.6" opacity="0.55"/>
  <path d="M180 38 v44 M188 38 v44 M196 38 v44 M204 38 v44 M212 38 v44" stroke-width="0.8" opacity="0.35"/>
  <!-- RJ45 8P8C jack shown on mating face -->
  <rect x="36" y="44" width="20" height="32" rx="2" stroke-width="1.8"/>
  <rect x="40" y="70" width="9" height="6" rx="1" fill="currentColor" opacity="0.18" stroke="none"/>
  <!-- Master keyway hint (top) -->
  <rect x="108" y="20" width="9" height="8" rx="1.5" fill="currentColor" opacity="0.3" stroke="none"/>
  <!-- Rear contact leads -->
  <line x1="216" y1="44" x2="250" y2="44" stroke-width="1.5" opacity="0.6"/>
  <line x1="216" y1="60" x2="250" y2="60" stroke-width="1.5" opacity="0.6"/>
  <line x1="216" y1="76" x2="250" y2="76" stroke-width="1.5" opacity="0.6"/>
  <text x="140" y="112" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">SuperNine RJ45 — Side Profile (Shell 17/19)</text>
</svg>
