<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- SuperNine USB G6 Plug with Accessory Threads (M22 x 1.0 coupling nut) -->
  <!-- Coupling nut (knurled ring) at mating face -->
  <rect x="22" y="32" width="26" height="56" rx="4" stroke-width="2"/>
  <path d="M26 34 v52 M32 34 v52 M38 34 v52 M44 34 v52" stroke-width="0.8" opacity="0.4"/>
  <!-- Shell body -->
  <rect x="48" y="36" width="120" height="48" rx="6"/>
  <!-- Accessory thread / backshell adapter (rear) -->
  <rect x="168" y="40" width="44" height="40" rx="4" stroke-width="1.6" opacity="0.6"/>
  <path d="M174 42 v36 M182 42 v36 M190 42 v36 M198 42 v36 M206 42 v36" stroke-width="0.8" opacity="0.35"/>
  <!-- USB Male Type-A blade on plug face -->
  <rect x="28" y="50" width="18" height="20" rx="2" stroke-width="1.6"/>
  <line x1="30" y1="60" x2="44" y2="60" stroke-width="3" opacity="0.18"/>
  <!-- Master key -->
  <rect x="100" y="28" width="9" height="8" rx="1.5" fill="currentColor" opacity="0.3" stroke="none"/>
  <!-- Cable exit -->
  <line x1="212" y1="54" x2="248" y2="54" stroke-width="1.5" opacity="0.6"/>
  <line x1="212" y1="62" x2="248" y2="62" stroke-width="1.5" opacity="0.6"/>
  <line x1="212" y1="70" x2="248" y2="70" stroke-width="1.5" opacity="0.6"/>
  <text x="140" y="112" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">SuperNine USB — G6 Plug, Accessory Threads</text>
</svg>
