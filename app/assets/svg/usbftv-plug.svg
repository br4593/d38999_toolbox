<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 110" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- Cable entry -->
  <rect x="8" y="44" width="26" height="18" rx="3"/>
  <!-- Coupling ring body -->
  <rect x="34" y="28" width="72" height="50" rx="4"/>
  <line x1="54" y1="30" x2="54" y2="76" opacity="0.4"/>
  <line x1="70" y1="30" x2="70" y2="76" opacity="0.4"/>
  <line x1="86" y1="30" x2="86" y2="76" opacity="0.4"/>
  <!-- Shell size 15 body -->
  <rect x="106" y="18" width="90" height="70" rx="6"/>
  <!-- USB-A port (USB 2.0 - 4 pins) -->
  <rect x="132" y="40" width="28" height="20" rx="2" stroke-width="2"/>
  <line x1="139" y1="44" x2="139" y2="50" stroke-width="1.2" opacity="0.6"/>
  <line x1="145" y1="44" x2="145" y2="50" stroke-width="1.2" opacity="0.6"/>
  <line x1="151" y1="44" x2="151" y2="50" stroke-width="1.2" opacity="0.6"/>
  <line x1="157" y1="44" x2="157" y2="50" stroke-width="1.2" opacity="0.6"/>
  <!-- Keying notch -->
  <rect x="148" y="10" width="8" height="6" rx="1.5" fill="currentColor" opacity="0.3"/>
  <text x="151" y="100" text-anchor="middle" font-size="9" stroke="none" fill="currentColor" opacity="0.6" font-family="system-ui,sans-serif">Shell 15</text>
  <text x="151" y="108" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">USBFTV Plug (USB 2.0)</text>
</svg>
