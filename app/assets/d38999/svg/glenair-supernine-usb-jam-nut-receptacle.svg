<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- SuperNine USB Jam-Nut Receptacle (07 rear panel mount) -->
  <!-- Panel (dashed) -->
  <rect x="150" y="6" width="6" height="108" fill="currentColor" opacity="0.08" stroke="none"/>
  <line x1="153" y1="6" x2="153" y2="114" stroke-dasharray="5 4" opacity="0.5" stroke-width="1.5"/>
  <!-- Mating-face shell body -->
  <rect x="52" y="34" width="100" height="52" rx="6"/>
  <!-- Coupling thread band (front) -->
  <rect x="30" y="42" width="22" height="36" rx="3" stroke-width="1.6" opacity="0.55"/>
  <!-- Hex jam nut (behind panel) -->
  <polygon points="158,30 178,20 198,30 198,90 178,100 158,90" stroke-width="2" opacity="0.75"/>
  <!-- Threaded standoff into panel -->
  <rect x="198" y="44" width="20" height="32" rx="2" stroke-width="1.4" opacity="0.5"/>
  <path d="M202 46 v28 M208 46 v28 M214 46 v28" stroke-width="0.8" opacity="0.35"/>
  <!-- USB Type-A port on mating face -->
  <rect x="32" y="50" width="20" height="20" rx="2" stroke-width="1.6"/>
  <rect x="34" y="52" width="16" height="5" rx="1" fill="currentColor" opacity="0.18" stroke="none"/>
  <!-- Master key -->
  <rect x="98" y="26" width="9" height="8" rx="1.5" fill="currentColor" opacity="0.3" stroke="none"/>
  <!-- Rear leads (4x size 22 cavities for USB 2.0) -->
  <line x1="218" y1="50" x2="252" y2="50" stroke-width="1.5" opacity="0.6"/>
  <line x1="218" y1="60" x2="252" y2="60" stroke-width="1.5" opacity="0.6"/>
  <line x1="218" y1="70" x2="252" y2="70" stroke-width="1.5" opacity="0.6"/>
  <text x="140" y="114" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">SuperNine USB — Jam-Nut Receptacle</text>
</svg>
