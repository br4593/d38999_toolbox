<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- SuperNine HDMI 2.0 — Jam-Nut Receptacle (CM / rear panel) Shell 17 -->
  <!-- Panel (dashed) -->
  <rect x="150" y="6" width="6" height="108" fill="currentColor" opacity="0.08" stroke="none"/>
  <line x1="153" y1="6" x2="153" y2="114" stroke-dasharray="5 4" opacity="0.5" stroke-width="1.5"/>
  <!-- Mating-face shell body -->
  <rect x="52" y="30" width="100" height="60" rx="6"/>
  <!-- Coupling thread band (front) -->
  <rect x="30" y="40" width="22" height="40" rx="3" stroke-width="1.6" opacity="0.55"/>
  <!-- Hex jam nut (behind panel) -->
  <polygon points="158,26 178,16 198,26 198,94 178,104 158,94" stroke-width="2" opacity="0.75"/>
  <!-- Threaded standoff into panel -->
  <rect x="198" y="42" width="20" height="36" rx="2" stroke-width="1.4" opacity="0.5"/>
  <path d="M202 44 v32 M208 44 v32 M214 44 v32" stroke-width="0.8" opacity="0.35"/>
  <!-- HDMI Type-A trapezoid port on mating face -->
  <path d="M32 48 H52 V62 L46 70 H38 L32 62 Z" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="36" y1="52" x2="48" y2="52" stroke-width="2" opacity="0.18"/>
  <!-- Master key -->
  <rect x="98" y="22" width="9" height="8" rx="1.5" fill="currentColor" opacity="0.3" stroke="none"/>
  <!-- Rear leads (PC tail / solder cup) -->
  <line x1="218" y1="48" x2="252" y2="48" stroke-width="1.5" opacity="0.6"/>
  <line x1="218" y1="60" x2="252" y2="60" stroke-width="1.5" opacity="0.6"/>
  <line x1="218" y1="72" x2="252" y2="72" stroke-width="1.5" opacity="0.6"/>
  <text x="140" y="114" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">SuperNine HDMI 2.0 — Jam-Nut Receptacle</text>
</svg>
