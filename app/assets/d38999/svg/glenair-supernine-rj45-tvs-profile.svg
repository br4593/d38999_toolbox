<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- SuperNine RJ45 TVS side / profile (Transient Voltage Suppression jam-nut/wall mount) -->
  <!-- Panel (dashed) -->
  <rect x="150" y="6" width="6" height="108" fill="currentColor" opacity="0.08" stroke="none"/>
  <line x1="153" y1="6" x2="153" y2="114" stroke-dasharray="5 4" opacity="0.5" stroke-width="1.5"/>
  <!-- Mating-face shell body -->
  <rect x="52" y="32" width="100" height="56" rx="6"/>
  <!-- Coupling thread band (front) -->
  <rect x="30" y="40" width="22" height="40" rx="3" stroke-width="1.6" opacity="0.55"/>
  <!-- Hex jam nut -->
  <polygon points="156,28 176,18 196,28 196,92 176,102 156,92" stroke-width="2" opacity="0.75"/>
  <!-- TVS diode module pod (rear, enlarged body) -->
  <rect x="196" y="36" width="40" height="48" rx="4" stroke-width="1.8"/>
  <path d="M210 50 l8 0 m-4 -4 v8 M222 60 l8 0" stroke-width="1" opacity="0.5"/>
  <text x="216" y="48" text-anchor="middle" font-size="7" stroke="none" fill="currentColor" opacity="0.7" font-family="system-ui,sans-serif">TVS</text>
  <!-- RJ45 jack on mating face -->
  <rect x="32" y="46" width="20" height="28" rx="2" stroke-width="1.6"/>
  <!-- Master key -->
  <rect x="98" y="24" width="9" height="8" rx="1.5" fill="currentColor" opacity="0.3" stroke="none"/>
  <!-- Rear leads -->
  <line x1="236" y1="52" x2="258" y2="52" stroke-width="1.5" opacity="0.6"/>
  <line x1="236" y1="68" x2="258" y2="68" stroke-width="1.5" opacity="0.6"/>
  <text x="140" y="114" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">SuperNine RJ45 TVS — Side Profile</text>
</svg>
