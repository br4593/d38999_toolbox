<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 130" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- PCB board -->
  <rect x="50" y="104" width="170" height="6" fill="currentColor" opacity="0.1" stroke="none"/>
  <line x1="50" y1="107" x2="220" y2="107" stroke-width="2" opacity="0.5"/>
  <!-- Stand-off legs -->
  <line x1="86" y1="82" x2="86" y2="104" stroke-width="2"/>
  <line x1="186" y1="82" x2="186" y2="104" stroke-width="2"/>
  <!-- Double flange plate -->
  <rect x="68" y="72" width="136" height="12" rx="2" stroke-width="2"/>
  <!-- Shell body -->
  <rect x="90" y="14" width="92" height="60" rx="6"/>
  <!-- USB-A port (face view) -->
  <rect x="118" y="32" width="28" height="20" rx="2" stroke-width="2"/>
  <rect x="122" y="36" width="20" height="12" rx="1" stroke-width="1.2" opacity="0.6"/>
  <!-- Keying notch -->
  <rect x="130" y="6" width="8" height="6" rx="1.5" fill="currentColor" opacity="0.3"/>
  <!-- Coupling thread ring -->
  <rect x="78" y="22" width="6" height="44" rx="2" stroke-width="1.5" opacity="0.5"/>
  <text x="135" y="126" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">USB3FTV Stand-off (PCB)</text>
</svg>
