<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- Left panel wall -->
  <rect x="94" y="4" width="6" height="102" fill="currentColor" opacity="0.08" stroke="none"/>
  <line x1="97" y1="4" x2="97" y2="106" stroke-dasharray="5 4" opacity="0.5" stroke-width="1.5"/>
  <!-- Right panel wall -->
  <rect x="220" y="4" width="6" height="102" fill="currentColor" opacity="0.08" stroke="none"/>
  <line x1="223" y1="4" x2="223" y2="106" stroke-dasharray="5 4" opacity="0.5" stroke-width="1.5"/>
  <!-- Bulkhead body -->
  <rect x="64" y="22" width="192" height="60" rx="5"/>
  <!-- Left mating face (RJ45) -->
  <rect x="22" y="36" width="30" height="24" rx="2" stroke-width="2"/>
  <line x1="26" y1="38" x2="26" y2="44" stroke-width="1" opacity="0.6"/>
  <line x1="30" y1="38" x2="30" y2="44" stroke-width="1" opacity="0.6"/>
  <line x1="34" y1="38" x2="34" y2="44" stroke-width="1" opacity="0.6"/>
  <line x1="38" y1="38" x2="38" y2="44" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="38" x2="42" y2="44" stroke-width="1" opacity="0.6"/>
  <line x1="46" y1="38" x2="46" y2="44" stroke-width="1" opacity="0.6"/>
  <line x1="50" y1="38" x2="50" y2="44" stroke-width="1" opacity="0.6" transform="translate(-2,0)"/>
  <!-- Right mating face (RJ45) -->
  <rect x="268" y="36" width="30" height="24" rx="2" stroke-width="2"/>
  <line x1="272" y1="38" x2="272" y2="44" stroke-width="1" opacity="0.6"/>
  <line x1="276" y1="38" x2="276" y2="44" stroke-width="1" opacity="0.6"/>
  <line x1="280" y1="38" x2="280" y2="44" stroke-width="1" opacity="0.6"/>
  <line x1="284" y1="38" x2="284" y2="44" stroke-width="1" opacity="0.6"/>
  <line x1="288" y1="38" x2="288" y2="44" stroke-width="1" opacity="0.6"/>
  <line x1="292" y1="38" x2="292" y2="44" stroke-width="1" opacity="0.6"/>
  <line x1="296" y1="38" x2="296" y2="44" stroke-width="1" opacity="0.6" transform="translate(-2,0)"/>
  <!-- Coupling threads (both sides) -->
  <rect x="6" y="30" width="16" height="44" rx="3" stroke-width="1.5" opacity="0.5"/>
  <rect x="298" y="30" width="16" height="44" rx="3" stroke-width="1.5" opacity="0.5"/>
  <!-- Center seal -->
  <rect x="155" y="18" width="10" height="68" rx="2" stroke-width="1.5" opacity="0.4"/>
  <text x="160" y="106" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">RJFTV Through-Bulkhead</text>
</svg>
