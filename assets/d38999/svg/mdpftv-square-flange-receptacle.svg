<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 120" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- Panel (dashed) -->
  <rect x="148" y="4" width="6" height="112" fill="currentColor" opacity="0.08" stroke="none"/>
  <line x1="151" y1="4" x2="151" y2="116" stroke-dasharray="5 4" opacity="0.5" stroke-width="1.5"/>
  <!-- Shell body (shell 13) -->
  <rect x="56" y="26" width="90" height="62" rx="5"/>
  <!-- Square flange plate -->
  <rect x="154" y="14" width="56" height="86" rx="3" stroke-width="2"/>
  <!-- 4 mounting holes -->
  <circle cx="168" cy="28" r="4" stroke-width="1.5"/>
  <circle cx="196" cy="28" r="4" stroke-width="1.5"/>
  <circle cx="168" cy="86" r="4" stroke-width="1.5"/>
  <circle cx="196" cy="86" r="4" stroke-width="1.5"/>
  <!-- Mini DP port -->
  <path d="M80 42 L104 42 L102 60 L82 60 Z" stroke-width="2"/>
  <!-- Pin indicators -->
  <line x1="86" y1="46" x2="86" y2="52" stroke-width="0.8" opacity="0.5"/>
  <line x1="90" y1="46" x2="90" y2="52" stroke-width="0.8" opacity="0.5"/>
  <line x1="94" y1="46" x2="94" y2="52" stroke-width="0.8" opacity="0.5"/>
  <line x1="98" y1="46" x2="98" y2="52" stroke-width="0.8" opacity="0.5"/>
  <!-- Keying notch -->
  <rect x="96" y="18" width="8" height="6" rx="1.5" fill="currentColor" opacity="0.3"/>
  <!-- Wire leads -->
  <line x1="214" y1="46" x2="236" y2="46" stroke-width="1.5" opacity="0.6"/>
  <line x1="214" y1="56" x2="236" y2="56" stroke-width="1.5" opacity="0.6"/>
  <line x1="214" y1="66" x2="236" y2="66" stroke-width="1.5" opacity="0.6"/>
  <text x="130" y="116" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">MDPFTV Square Flange Receptacle</text>
</svg>
