<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- SuperNine USB Wall-Mount Receptacle (00 slotted / D0 round holes) -->
  <!-- Panel (dashed) -->
  <rect x="150" y="6" width="6" height="108" fill="currentColor" opacity="0.08" stroke="none"/>
  <line x1="153" y1="6" x2="153" y2="114" stroke-dasharray="5 4" opacity="0.5" stroke-width="1.5"/>
  <!-- Square mounting flange with corner holes -->
  <rect x="140" y="16" width="14" height="88" rx="2" stroke-width="2"/>
  <circle cx="147" cy="26" r="4" stroke-width="1.4" opacity="0.7"/>
  <circle cx="147" cy="94" r="4" stroke-width="1.4" opacity="0.7"/>
  <!-- Mating-face shell body -->
  <rect x="52" y="36" width="88" height="48" rx="6"/>
  <!-- Coupling thread band (front) -->
  <rect x="30" y="44" width="22" height="32" rx="3" stroke-width="1.6" opacity="0.55"/>
  <!-- Rear body through panel -->
  <rect x="154" y="46" width="26" height="28" rx="3" stroke-width="1.6" opacity="0.55"/>
  <!-- USB Type-A port -->
  <rect x="32" y="50" width="20" height="20" rx="2" stroke-width="1.6"/>
  <rect x="34" y="52" width="16" height="5" rx="1" fill="currentColor" opacity="0.18" stroke="none"/>
  <!-- Master key -->
  <rect x="92" y="28" width="9" height="8" rx="1.5" fill="currentColor" opacity="0.3" stroke="none"/>
  <!-- Rear leads -->
  <line x1="180" y1="52" x2="252" y2="52" stroke-width="1.5" opacity="0.6"/>
  <line x1="180" y1="60" x2="252" y2="60" stroke-width="1.5" opacity="0.6"/>
  <line x1="180" y1="68" x2="252" y2="68" stroke-width="1.5" opacity="0.6"/>
  <text x="140" y="114" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">SuperNine USB — Wall-Mount Receptacle</text>
</svg>
