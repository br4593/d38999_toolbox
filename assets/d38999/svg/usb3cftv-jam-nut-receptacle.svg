<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 110" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- Panel (dashed) -->
  <rect x="148" y="6" width="6" height="98" fill="currentColor" opacity="0.08" stroke="none"/>
  <line x1="151" y1="6" x2="151" y2="104" stroke-dasharray="5 4" opacity="0.5" stroke-width="1.5"/>
  <!-- Shell body -->
  <rect x="60" y="22" width="88" height="60" rx="6"/>
  <!-- Hex jam nut -->
  <polygon points="158,28 174,20 190,28 190,76 174,84 158,76" stroke-width="2" opacity="0.7"/>
  <!-- USB-C port -->
  <rect x="88" y="43" width="24" height="14" rx="7" stroke-width="2"/>
