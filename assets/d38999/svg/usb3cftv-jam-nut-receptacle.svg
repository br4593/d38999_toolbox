  <rect x="38" y="32" width="22" height="40" rx="3" stroke-width="1.5" opacity="0.5"/>
  <!-- Keying notch -->
  <rect x="100" y="14" width="8" height="6" rx="1.5" fill="currentColor" opacity="0.3"/>
  <!-- Wire leads -->
  <line x1="196" y1="42" x2="220" y2="42" stroke-width="1.5" opacity="0.6"/>
  <line x1="196" y1="52" x2="220" y2="52" stroke-width="1.5" opacity="0.6"/>
  <line x1="196" y1="62" x2="220" y2="62" stroke-width="1.5" opacity="0.6"/>
  <text x="130" y="108" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">USB3CFTV Jam Nut Receptacle</text>
</svg>
