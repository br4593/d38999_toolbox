<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 120" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- Glenair SuperSeal USB 3.0 plug cordset adapter 233-358 - side/size view (shell 15) -->
  <!-- Coupling nut / knurled barrel -->
  <rect x="30" y="34" width="44" height="46" rx="5"/>
  <line x1="38" y1="34" x2="38" y2="80" stroke-width="1.1" opacity="0.4"/>
  <line x1="46" y1="34" x2="46" y2="80" stroke-width="1.1" opacity="0.4"/>
  <line x1="54" y1="34" x2="54" y2="80" stroke-width="1.1" opacity="0.4"/>
  <line x1="62" y1="34" x2="62" y2="80" stroke-width="1.1" opacity="0.4"/>
  <!-- Shell barrel (Ø1.280 / 32.51) -->
  <rect x="74" y="40" width="70" height="34" rx="4"/>
  <!-- Master key notch (top) -->
  <rect x="104" y="32" width="8" height="6" rx="1.5" fill="currentColor" opacity="0.3" stroke="none"/>
  <!-- Front mating face (USB Type-A plug) -->
  <rect x="144" y="44" width="26" height="26" rx="3" stroke-width="2"/>
  <rect x="149" y="50" width="16" height="14" rx="1.5" stroke-width="1.3" opacity="0.6"/>
  <!-- Rear cable gland accepting cordset OD 0.118-0.243 -->
  <path d="M30 48 H14 a6 6 0 0 0 -6 6 v6 a6 6 0 0 0 6 6 H30" stroke-width="2"/>
  <line x1="8" y1="57" x2="2" y2="57" stroke-width="2.5" opacity="0.55"/>
  <!-- Overall length hint: 3.000 (76.2) REF -->
  <line x1="30" y1="100" x2="170" y2="100" stroke-width="1" opacity="0.45"/>
  <line x1="30" y1="96" x2="30" y2="104" stroke-width="1" opacity="0.45"/>
  <line x1="170" y1="96" x2="170" y2="104" stroke-width="1" opacity="0.45"/>
  <text x="100" y="113" text-anchor="middle" font-size="9" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">USB cordset plug adapter — 3.000 (76.2) REF</text>
</svg>
