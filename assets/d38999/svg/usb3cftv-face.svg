<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- Shell size 11 outer ring -->
  <circle cx="110" cy="48" r="32" stroke-width="2.5"/>
  <circle cx="110" cy="48" r="28" stroke-width="1.5" opacity="0.5"/>
  <!-- USB-C port (pill shape, centered) -->
  <rect x="97" y="41" width="26" height="14" rx="7" stroke-width="2"/>
  <!-- Contact pairs (differential) -->
  <circle cx="101" cy="48" r="1.2" fill="currentColor" stroke="none" opacity="0.5"/>
  <circle cx="105" cy="48" r="1.2" fill="currentColor" stroke="none" opacity="0.5"/>
  <circle cx="110" cy="48" r="1.2" fill="currentColor" stroke="none" opacity="0.5"/>
  <circle cx="115" cy="48" r="1.2" fill="currentColor" stroke="none" opacity="0.5"/>
  <circle cx="119" cy="48" r="1.2" fill="currentColor" stroke="none" opacity="0.5"/>
  <!-- Keying notch -->
  <rect x="106" y="17" width="8" height="5" rx="1.5" fill="currentColor" opacity="0.3"/>
  <!-- Coding indicator -->
  <circle cx="110" cy="78" r="2" fill="currentColor" opacity="0.2" stroke="none"/>
  <text x="110" y="94" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">USB3CFTV Face (Shell 11)</text>
</svg>
