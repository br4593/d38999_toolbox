<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 120" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- Panel (dashed) -->
  <rect x="148" y="6" width="6" height="108" fill="currentColor" opacity="0.08" stroke="none"/>
  <line x1="151" y1="6" x2="151" y2="114" stroke-dasharray="5 4" opacity="0.5" stroke-width="1.5"/>
  <!-- Shell body -->
  <rect x="60" y="26" width="88" height="60" rx="6"/>
  <!-- Square flange plate -->
  <rect x="154" y="14" width="56" height="84" rx="3" stroke-width="2"/>
  <!-- 4 mounting holes -->
  <circle cx="166" cy="28" r="4" stroke-width="1.5"/>
  <circle cx="198" cy="28" r="4" stroke-width="1.5"/>
  <circle cx="166" cy="84" r="4" stroke-width="1.5"/>
  <circle cx="198" cy="84" r="4" stroke-width="1.5"/>
  <!-- USB-C port -->
  <rect x="88" y="47" width="24" height="14" rx="7" stroke-width="2"/>
  <!-- Keying notch -->
  <rect x="100" y="18" width="8" height="6" rx="1.5" fill="currentColor" opacity="0.3"/>
  <!-- Wire leads -->
  <line x1="214" y1="46" x2="238" y2="46" stroke-width="1.5" opacity="0.6"/>
  <line x1="214" y1="56" x2="238" y2="56" stroke-width="1.5" opacity="0.6"/>
  <line x1="214" y1="66" x2="238" y2="66" stroke-width="1.5" opacity="0.6"/>
  <text x="130" y="116" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">USB3CFTV Square Flange Receptacle</text>
</svg>
