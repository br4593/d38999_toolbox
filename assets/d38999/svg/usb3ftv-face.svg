<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- Shell size 15 outer ring -->
  <circle cx="110" cy="48" r="36" stroke-width="2.5"/>
  <circle cx="110" cy="48" r="32" stroke-width="1.5" opacity="0.5"/>
  <!-- USB-A port rectangle -->
  <rect x="96" y="38" width="28" height="20" rx="2" stroke-width="2"/>
  <!-- Inner contact plate -->
  <rect x="100" y="42" width="20" height="12" rx="1" stroke-width="1.2" opacity="0.5"/>
  <!-- 4 signal + 5 power differential pairs indicated -->
  <line x1="103" y1="44" x2="103" y2="48" stroke-width="1" opacity="0.5"/>
  <line x1="107" y1="44" x2="107" y2="48" stroke-width="1" opacity="0.5"/>
  <line x1="111" y1="44" x2="111" y2="48" stroke-width="1" opacity="0.5"/>
  <line x1="115" y1="44" x2="115" y2="48" stroke-width="1" opacity="0.5"/>
  <line x1="103" y1="50" x2="103" y2="52" stroke-width="0.8" opacity="0.4"/>
  <line x1="107" y1="50" x2="107" y2="52" stroke-width="0.8" opacity="0.4"/>
  <line x1="111" y1="50" x2="111" y2="52" stroke-width="0.8" opacity="0.4"/>
  <line x1="115" y1="50" x2="115" y2="52" stroke-width="0.8" opacity="0.4"/>
  <!-- Keying notch -->
  <rect x="106" y="14" width="8" height="5" rx="1.5" fill="currentColor" opacity="0.3"/>
  <!-- Coding indicator -->
  <circle cx="110" cy="82" r="2" fill="currentColor" opacity="0.2" stroke="none"/>
  <text x="110" y="96" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">USB3FTV Face (Shell 15)</text>
</svg>
