<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 110" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- Panel (dashed) -->
  <rect x="158" y="4" width="6" height="102" fill="currentColor" opacity="0.08" stroke="none"/>
  <line x1="161" y1="4" x2="161" y2="106" stroke-dasharray="5 4" opacity="0.5" stroke-width="1.5"/>
  <!-- Shell body -->
  <rect x="56" y="18" width="100" height="70" rx="6"/>
  <!-- Hex jam nut -->
  <polygon points="168,24 186,16 204,24 204,82 186,90 168,82" stroke-width="2" opacity="0.7"/>
  <!-- USB-A port -->
  <rect x="86" y="40" width="28" height="20" rx="2" stroke-width="2"/>
  <rect x="90" y="44" width="20" height="12" rx="1" stroke-width="1.2" opacity="0.6"/>
  <!-- Coupling thread area -->
  <rect x="34" y="30" width="22" height="46" rx="3" stroke-width="1.5" opacity="0.5"/>
  <!-- Keying notch -->
  <rect x="102" y="10" width="8" height="6" rx="1.5" fill="currentColor" opacity="0.3"/>
  <!-- Wire leads (rear) -->
  <line x1="210" y1="40" x2="238" y2="40" stroke-width="1.5" opacity="0.6"/>
  <line x1="210" y1="50" x2="238" y2="50" stroke-width="1.5" opacity="0.6"/>
  <line x1="210" y1="60" x2="238" y2="60" stroke-width="1.5" opacity="0.6"/>
  <line x1="210" y1="70" x2="238" y2="70" stroke-width="1.5" opacity="0.6"/>
  <text x="135" y="108" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">USB3FTV Jam Nut Receptacle</text>
</svg>
