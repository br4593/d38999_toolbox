<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 120" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- Glenair SuperSeal USB-C 3.2 Gen 2 panel-mount receptacle - side/size view (shell 13) -->
  <!-- Mounting panel (dashed reference) -->
  <rect x="150" y="6" width="6" height="108" fill="currentColor" opacity="0.08" stroke="none"/>
  <line x1="153" y1="6" x2="153" y2="114" stroke-dasharray="5 4" opacity="0.5" stroke-width="1.5"/>
  <!-- Rear shell body / coupling barrel (compact size 13) -->
  <rect x="46" y="34" width="90" height="48" rx="6"/>
  <line x1="68" y1="34" x2="68" y2="82" stroke-width="1.2" opacity="0.4"/>
  <line x1="96" y1="34" x2="96" y2="82" stroke-width="1.2" opacity="0.4"/>
  <!-- Square mounting flange (4x thru-holes) -->
  <rect x="136" y="16" width="22" height="84" rx="3" stroke-width="2"/>
  <circle cx="147" cy="28" r="4.5" stroke-width="1.5"/>
  <circle cx="147" cy="88" r="4.5" stroke-width="1.5"/>
  <!-- Front USB Type-C receptacle face (stadium opening) -->
  <rect x="158" y="48" width="40" height="22" rx="3" stroke-width="2"/>
  <rect x="164" y="54" width="24" height="9" rx="4.5" stroke-width="1.4" opacity="0.65"/>
  <!-- Master keyway notch (top) -->
  <rect x="172" y="38" width="8" height="6" rx="1.5" fill="currentColor" opacity="0.3" stroke="none"/>
  <!-- Rear termination leads -->
  <line x1="28" y1="46" x2="46" y2="46" stroke-width="1.5" opacity="0.6"/>
  <line x1="28" y1="58" x2="46" y2="58" stroke-width="1.5" opacity="0.6"/>
  <line x1="28" y1="70" x2="46" y2="70" stroke-width="1.5" opacity="0.6"/>
  <text x="119" y="113" text-anchor="middle" font-size="9" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">SuperSeal USB-C — Size 13 panel mount</text>
</svg>
