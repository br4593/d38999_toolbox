<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 110" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- Left panel wall -->
  <rect x="88" y="4" width="6" height="102" fill="currentColor" opacity="0.08" stroke="none"/>
  <line x1="91" y1="4" x2="91" y2="106" stroke-dasharray="5 4" opacity="0.5" stroke-width="1.5"/>
  <!-- Right panel wall -->
  <rect x="206" y="4" width="6" height="102" fill="currentColor" opacity="0.08" stroke="none"/>
  <line x1="209" y1="4" x2="209" y2="106" stroke-dasharray="5 4" opacity="0.5" stroke-width="1.5"/>
  <!-- Bulkhead body passing through panel -->
  <rect x="60" y="26" width="180" height="54" rx="5"/>
  <!-- Left mating face (USB-A) -->
  <rect x="26" y="38" width="28" height="20" rx="2" stroke-width="2"/>
  <line x1="33" y1="42" x2="33" y2="48" stroke-width="1.2" opacity="0.6"/>
  <line x1="39" y1="42" x2="39" y2="48" stroke-width="1.2" opacity="0.6"/>
  <line x1="45" y1="42" x2="45" y2="48" stroke-width="1.2" opacity="0.6"/>
  <line x1="51" y1="42" x2="51" y2="48" stroke-width="1.2" opacity="0.6"/>
  <!-- Right mating face (USB-A) -->
  <rect x="246" y="38" width="28" height="20" rx="2" stroke-width="2"/>
  <line x1="253" y1="42" x2="253" y2="48" stroke-width="1.2" opacity="0.6"/>
  <line x1="259" y1="42" x2="259" y2="48" stroke-width="1.2" opacity="0.6"/>
  <line x1="265" y1="42" x2="265" y2="48" stroke-width="1.2" opacity="0.6"/>
  <line x1="271" y1="42" x2="271" y2="48" stroke-width="1.2" opacity="0.6"/>
  <!-- Coupling threads (both sides) -->
  <rect x="10" y="32" width="16" height="42" rx="3" stroke-width="1.5" opacity="0.5"/>
  <rect x="274" y="32" width="16" height="42" rx="3" stroke-width="1.5" opacity="0.5"/>
  <!-- Center seal ring -->
  <rect x="145" y="22" width="10" height="62" rx="2" stroke-width="1.5" opacity="0.4"/>
  <text x="150" y="106" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">USBFTV Through-Bulkhead</text>
</svg>
