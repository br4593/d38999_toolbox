<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 96" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- D38999-style shell -->
  <circle cx="110" cy="48" r="38" stroke-width="2.5"/>
  <circle cx="110" cy="48" r="34" stroke-width="1.5" opacity="0.5"/>
  <!-- USB-C port (rounded rectangle, symmetric) -->
  <rect x="97" y="41" width="26" height="14" rx="7" stroke-width="2"/>
  <!-- Center line -->
  <line x1="104" y1="48" x2="116" y2="48" stroke-width="0.8" opacity="0.4"/>
  <!-- Keying notch -->
  <rect x="106" y="12" width="8" height="5" rx="1" fill="currentColor" opacity="0.3"/>
  <text x="110" y="92" text-anchor="middle" font-size="11" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">Rugged USB-C (USB3CFTV style)</text>
</svg>
