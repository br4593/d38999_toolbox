<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 130" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- PCB board -->
  <rect x="50" y="106" width="180" height="6" fill="currentColor" opacity="0.1" stroke="none"/>
  <line x1="50" y1="109" x2="230" y2="109" stroke-width="2" opacity="0.5"/>
  <!-- Stand-off legs -->
  <line x1="90" y1="84" x2="90" y2="106" stroke-width="2"/>
  <line x1="196" y1="84" x2="196" y2="106" stroke-width="2"/>
  <!-- Double flange plate -->
  <rect x="72" y="74" width="142" height="12" rx="2" stroke-width="2"/>
  <!-- Shell body (shell 17) -->
  <rect x="92" y="12" width="102" height="64" rx="6"/>
  <!-- HDMI port trapezoid (face) -->
  <path d="M122 28 L162 28 L159 52 L125 52 Z" stroke-width="2"/>
  <!-- Pin indicators -->
  <line x1="130" y1="32" x2="130" y2="38" stroke-width="0.9" opacity="0.5"/>
  <line x1="135" y1="32" x2="135" y2="38" stroke-width="0.9" opacity="0.5"/>
  <line x1="140" y1="32" x2="140" y2="38" stroke-width="0.9" opacity="0.5"/>
  <line x1="145" y1="32" x2="145" y2="38" stroke-width="0.9" opacity="0.5"/>
  <line x1="150" y1="32" x2="150" y2="38" stroke-width="0.9" opacity="0.5"/>
  <line x1="155" y1="32" x2="155" y2="38" stroke-width="0.9" opacity="0.5"/>
  <!-- Keying notch -->
  <rect x="139" y="4" width="8" height="6" rx="1.5" fill="currentColor" opacity="0.3"/>
  <!-- Coupling ring -->
  <rect x="80" y="20" width="6" height="48" rx="2" stroke-width="1.5" opacity="0.5"/>
  <text x="143" y="126" text-anchor="middle" font-size="10" stroke="none" fill="currentColor" font-family="system-ui,sans-serif">HDMIFTV Stand-off (PCB)</text>
</svg>
