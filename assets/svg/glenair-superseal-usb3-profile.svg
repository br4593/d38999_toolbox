<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 120" fill="none" stroke="currentColor" stroke-width="2.5">
  <!-- Glenair SuperSeal USB 3.0 panel-mount receptacle - side/size view (shell 15) -->
  <!-- Mounting panel (dashed reference) -->
  <rect x="150" y="6" width="6" height="108" fill="currentColor" opacity="0.08" stroke="none"/>
  <line x1="153" y1="6" x2="153" y2="114" stroke-dasharray="5 4" opacity="0.5" stroke-width="1.5"/>
  <!-- Rear shell body / coupling barrel -->
  <rect x="40" y="30" width="96" height="54" rx="6"/>
  <line x1="62" y1="30" x2="62" y2="84" stroke-width="1.2" opacity="0.4"/>
  <line x1="92" y1="30" x2="92" y2="84" stroke-width="1.2" opacity="0.4"/>
  <!-- Square mounting flange (1.516 / Ø1.614 in, 4x thru-holes) -->
  <rect x="136" y="12" width="22" height="90" rx="3" stroke-width="2"/>
  <circle cx="147" cy="24" r="4.5" stroke-width="1.5"/>
  <circle cx="147" cy="90" r="4.5" stroke-width="1.5"/>
  <!-- Front USB-A receptacle face protruding through panel -->
  <rect x="158" y="42" width="40" height="30" rx="4" stroke-width="2"/>
  <rect x="164" y="50" width="22" height="14" rx="1.5" stroke-width="1.4" opacity="0.6"/>
  <rect x="166" y="52.5" width="18" height="4" rx="1" fill="currentColor" opacity="0.22" stroke="none"/>
  <!-- Master keyway notch (top) -->
  <rect x="172" y="34" width="8" height="6" rx="1.5" fill="currentColor" opacity="0.3" stroke="none"/>
  <!-- Rear termination leads -->
  <line x1="22" y1="44" x2="40" y2="44" stroke-width="1.5" opacity="0.6"/>
  <line x1="22" y1="57" x2="40" y2="57" stroke-width="1.5" opacity="0.6"/>
  <line x1="22" y1="70" x2="40" y2="70" stroke-width="1.5" opacity="0.6"/>
  <!-- Overall length dimension hint: 1.675 (42.55) MAX -->
  <line x1="40" y1="108" x2="198" y2="108" stroke-width="1" opacity="0.45"/>
  <line x1="40" y1="104" x2="40" y2="112" stroke-width="1" opacity="0.45"/>
  <line x1="198" y1="104" x2="198" y2="112" stroke-width="1" opacity="0.45"/>
  <text x="119" y="116" text-anchor="middle" font-size="7.5" stroke="none" fill="currentColor" font-family="system-ui,sans-serif" opacity="0.7">1.675 (42.55) MAX</text>
  <text x="232" y="60" text-anchor="middle" font-size="9" stroke="none" fill="currentColor" font-family="system-ui,sans-serif" transform="rotate(90 232 60)">Size 15 panel mount</text>
</svg>
