<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 130" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
  <!-- SuperSeal USB 3.0 Type-A panel-mount (jam-nut/flange) receptacle, side elevation -->
  <line x1="20" y1="65" x2="232" y2="65" stroke-width="0.8" stroke-dasharray="8 4 2 4" opacity="0.35"/>

  <!-- Rear termination leads (PC tails) -->
  <path d="M22 52 H40 M22 65 H40 M22 78 H40" stroke-width="1.5" opacity="0.6"/>

  <!-- Rear accessory thread band -->
  <rect x="40" y="44" width="22" height="42" rx="3" stroke-width="1.5" opacity="0.8"/>
  <g stroke-width="0.85" opacity="0.45"><path d="M44 48 l4 6 M51 48 l4 6 M58 48 l4 6 M44 76 l4 6 M51 76 l4 6 M58 76 l4 6"/></g>

  <!-- Main shell body -->
  <rect x="62" y="36" width="74" height="58" rx="6"/>
  <!-- Forward knurled coupling ring -->
  <rect x="120" y="34" width="16" height="62" rx="3" stroke-width="1.3" opacity="0.7"/>
  <g stroke-width="0.85" opacity="0.45"><path d="M124 38 V92 M128 38 V92 M132 38 V92"/></g>

  <!-- Square mounting flange (4x thru-holes) at panel -->
  <rect x="136" y="16" width="20" height="98" rx="3" stroke-width="2"/>
  <circle cx="146" cy="27" r="5" stroke-width="1.5"/>
  <circle cx="146" cy="103" r="5" stroke-width="1.5"/>

  <!-- Mounting panel (dashed reference) -->
  <rect x="156" y="8" width="6" height="114" fill="currentColor" stroke="none" opacity="0.08"/>
  <line x1="156" y1="8" x2="156" y2="122" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.5"/>

  <!-- Protruding receptacle housing (front, through panel) -->
  <rect x="162" y="44" width="44" height="42" rx="4"/>
  <!-- master keyway hint -->
  <path d="M178 44 v-6 h10 v6" stroke-width="1.3" opacity="0.6"/>
  <!-- USB Type-A opening -->
  <rect x="170" y="56" width="28" height="18" rx="2" stroke-width="1.5" opacity="0.7"/>
  <rect x="173" y="59" width="22" height="6" rx="1" fill="currentColor" stroke="none" opacity="0.22"/>
</svg>
