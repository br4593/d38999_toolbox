name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate derived data inputs
        run: python scripts/build_valid_d38999_pns.py

      - name: Rebuild app/ from sources
        run: python scripts/build_app.py

      - name: Sanity-check built app
        run: |
          test -f app/index.html
          test -f app/app-data.js
          test -f app/app.js
          test -f app/converter.js
          test -f app/styles.css
          test -d app/assets/svg
          test -d app/data
          svg_count=$(ls app/assets/svg/*.svg | wc -l)
          echo "SVG arrangement crops: $svg_count"
          test "$svg_count" -ge 50

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
