<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Inter, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #0b2545; }
      .h     { font-size: 14px; font-weight: 700; fill: #0b2545; }
      .t     { font-size: 12px; fill: #1f3a64; }
      .body  { fill: #d1d5db; stroke: #0b2545; stroke-width: 2; }
      .pin   { fill: #f59e0b; stroke: #92400e; stroke-width: 1.2; }
      .sok   { fill: #ffffff; stroke: #1f3a64; stroke-width: 1.6; }
      .arrow { stroke: #0b2545; stroke-width: 2; fill: none; marker-end: url(#mk3); }
      .tag   { font-size: 12px; font-weight: 700; fill: #0b2545; }
    </style>
    <marker id="mk3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b2545"/>
    </marker>
  </defs>

  <text x="40" y="40" class="title">Reciprocal mating logic</text>
  <text x="40" y="62" class="t">Receptacle ↔ plug pairing depends on shell type, shell size, insert arrangement, and polarization.</text>

  <!-- Plug -->
  <g transform="translate(80,120)">
    <rect class="body" x="0" y="0" width="160" height="180" rx="16"/>
    <text x="80" y="-10" text-anchor="middle" class="h">Plug (style P)</text>
    <text x="80" y="200" text-anchor="middle" class="t">D38999/26WE35PN</text>
    <circle class="pin" cx="55"  cy="70"  r="8"/>
    <circle class="pin" cx="105" cy="70"  r="8"/>
    <circle class="pin" cx="55"  cy="120" r="8"/>
    <circle class="pin" cx="105" cy="120" r="8"/>
    <circle class="pin" cx="80"  cy="95"  r="8"/>
  </g>

  <!-- Arrow -->
  <path class="arrow" d="M260,210 L370,210"/>
  <text x="315" y="200" text-anchor="middle" class="tag">mates with</text>

  <!-- Receptacle -->
  <g transform="translate(390,120)">
    <rect class="body" x="0" y="0" width="160" height="180" rx="16"/>
    <text x="80" y="-10" text-anchor="middle" class="h">Receptacle (style S)</text>
    <text x="80" y="200" text-anchor="middle" class="t">D38999/24WE35SN</text>
    <circle class="sok" cx="55"  cy="70"  r="10"/>
    <circle class="sok" cx="105" cy="70"  r="10"/>
    <circle class="sok" cx="55"  cy="120" r="10"/>
    <circle class="sok" cx="105" cy="120" r="10"/>
    <circle class="sok" cx="80"  cy="95"  r="10"/>
  </g>

  <!-- Rule card -->
  <g transform="translate(610,110)">
    <rect x="0" y="0" width="240" height="220" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/>
    <text x="120" y="26" text-anchor="middle" class="h">Match rules</text>
    <text x="14"  y="56" class="t">• Same shell size (E = 17)</text>
    <text x="14"  y="78" class="t">• Same arrangement (35)</text>
    <text x="14" y="100" class="t">• Same polarization (N/A/B/C/D/E)</text>
    <text x="14" y="122" class="t">• Opposite contact style P ↔ S</text>
    <text x="14" y="144" class="t">• Compatible shell type pair</text>
    <text x="14" y="166" class="t">  /20 plug ↔ /24 wall recept., etc.</text>
    <text x="14" y="198" class="t" font-style="italic">App computes this on the</text>
    <text x="14" y="214" class="t" font-style="italic">Mating tab automatically.</text>
  </g>

  <text x="40" y="380" class="h">Series III keying teeth</text>
  <text x="40" y="398" class="t">Polarization codes (N, A, B, C, D, E) rotate the keying teeth on the shell so only the correct mate fits.</text>
</svg>
